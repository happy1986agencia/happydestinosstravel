<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pre-Reserva - Happy Destinoss Travel</title>

<style>
body{margin:0;font-family:'Segoe UI',sans-serif;background:#eef2f7;color:#2c3e50;}
.container{max-width:900px;margin:30px auto;padding:20px;}
.badge{background:#2ecc71;color:white;padding:15px;border-radius:50px;text-align:center;font-weight:bold;font-size:18px;}
.title{text-align:center;margin:20px 0;font-size:18px;}
.card{background:white;border-radius:15px;box-shadow:0 6px 20px rgba(0,0,0,.08);margin-top:20px;overflow:hidden;}
.card-header{background:#2c3e50;color:#00c3ff;padding:15px;font-weight:bold;font-size:18px;}
.card-body{padding:20px;}
.row{display:flex;flex-wrap:wrap;gap:20px;margin-bottom:15px;}
.item{flex:1;min-width:200px;}
.label{font-size:12px;color:#7f8c8d;text-transform:uppercase;}
.value{font-weight:bold;margin-top:5px;}
</style>
</head>

<body>

<div class="container">

<div class="badge">✔ ¡Pre-Reserva Confirmada!</div>

<div class="title">¡Felicitaciones, <b id="clienteNombre">Cliente</b>! Aquí está el resumen de tu próximo viaje.</div>

<div class="card">
<div class="card-header">Resumen del Viaje</div>
<div class="card-body">

<div class="row">
<div class="item"><div class="label">Destino</div><div class="value" id="destino">--</div></div>
<div class="item"><div class="label">Hotel</div><div class="value" id="hotel">--</div></div>
</div>

<div class="row">
<div class="item"><div class="label">Check-in</div><div class="value" id="checkin">--</div></div>
<div class="item"><div class="label">Check-out</div><div class="value" id="checkout">--</div></div>
<div class="item"><div class="label">Noches</div><div class="value" id="noches">--</div></div>
</div>

<div class="row">
<div class="item"><div class="label">Habitaciones</div><div class="value" id="habitaciones">--</div></div>
<div class="item"><div class="label">Localizador</div><div class="value" id="localizador">--</div></div>
<div class="item"><div class="label">Régimen</div><div class="value" id="regimen">--</div></div>
</div>

<div class="row">
<div class="item"><div class="label">Notas</div><div class="value" id="notas">--</div></div>
</div>

</div>
</div>

<div class="card">
<div class="card-header">Información del Viajero</div>
<div class="card-body">

<div class="row">
<div class="item"><div class="label">Titular</div><div class="value" id="titular">--</div></div>
<div class="item"><div class="label">Documento</div><div class="value" id="documento">--</div></div>
<div class="item"><div class="label">Teléfono</div><div class="value" id="telefono">--</div></div>
</div>

<div class="row">
<div class="item"><div class="label">Correo</div><div class="value" id="correo">--</div></div>
</div>

</div>
</div>

</div>

<script>
// EDITA AQUÍ TUS DATOS

document.getElementById('clienteNombre').innerText = 'Luz Marina Beltrán';
document.getElementById('destino').innerText = 'Brasil - Río de Janeiro';
document.getElementById('hotel').innerText = 'Hotel Nacional Río de Janeiro';
document.getElementById('checkin').innerText = '18 Oct 2026';
document.getElementById('checkout').innerText = '25 Oct 2026';
document.getElementById('noches').innerText = '7 noches';
document.getElementById('habitaciones').innerText = '1 habitación';
document.getElementById('localizador').innerText = '52103343000';
document.getElementById('regimen').innerText = 'Media pensión';
document.getElementById('notas').innerText = 'Ninguna';

document.getElementById('titular').innerText = 'Luz Marina Beltrán';
document.getElementById('documento').innerText = '51661437';
document.getElementById('telefono').innerText = '3102209890';
document.getElementById('correo').innerText = 'correo@email.com';
</script>

</body>
</html>
